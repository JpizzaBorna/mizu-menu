name: Deploy Mizu menu to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the site from the uploaded parts
        run: |
          cat site.zip.part-* > site.zip
          mkdir _site
          unzip -q site.zip -d _site
          for f in overlay*.zip; do if [ -f "$f" ]; then unzip -q -o "$f" -d _site; fi; done
          ls _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
